<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversión Región del Maule | Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        brand: { DEFAULT: '#00306b' }
                    },
                    boxShadow: { 'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "recharts": "https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0,react-dom@18.2.0"
        }
    }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .leaflet-container { z-index: 0; width: 100%; height: 100%; background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root:empty::before { content: 'Conectando con Power Automate Maule...'; display: flex; height: 100vh; width: 100%; justify-content: center; align-items: center; color: #64748b; font-size: 1.2rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden">
    <div id="root"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, ResponsiveContainer, Cell } from 'recharts';
        import { Database, Map as MapIcon, Search, Building2, Wallet, TrendingUp, X, Check, ArrowRight } from 'lucide-react';

        // ==========================================
        // CONFIGURACIÓN DE LA API
        // ==========================================
        const POWER_AUTOMATE_URL = "https://default6780ef6e6e8c4ac2b2bc18eb02f617.a6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/46b6cb57149e41be940912e00255933e/triggers/manual/paths/invoke?api-version=1";

        const COLS = { NOMBRE: "2", TITULAR: "6", SECTOR: "9", INVERSION: "10", ESTADO: "13", COORDENADAS: "17" };
        const COLORS = ['#4f46e5', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'];

        const formatMoney = (v) => `$${new Intl.NumberFormat('es-CL').format(v)} MM`;

        const MapComponent = ({ data, sectors, onProjectClick }) => {
            const mapRef = useRef(null); const mapInst = useRef(null);
            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (!mapInst.current) {
                    mapInst.current = window.L.map(mapRef.current, { zoomControl: false }).setView([-35.4264, -71.6554], 7);
                    window.L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapInst.current);
                }
                mapInst.current.eachLayer(l => { if (l instanceof window.L.CircleMarker) mapInst.current.removeLayer(l); });
                data.forEach(p => {
                    if (!p.lat || !p.lng) return;
                    const color = COLORS[sectors.indexOf(p.sector) % COLORS.length] || '#4f46e5';
                    const marker = window.L.circleMarker([p.lat, p.lng], { radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.8 }).addTo(mapInst.current);
                    marker.bindTooltip(`<b>${p.nombre}</b><br>${p.sector}<br>${formatMoney(p.inversion)}`);
                    marker.on('click', () => onProjectClick(p.nombre));
                });
            }, [data, sectors]);
            return <div ref={mapRef} className="w-full h-full rounded-xl border border-slate-100" />;
        };

        const Dashboard = ({ onBack }) => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const fetchAPI = async () => {
                    try {
                        const response = await fetch(POWER_AUTOMATE_URL);
                        const raw = await response.json();
                        const parsed = raw.map(d => {
                            const coords = d[COLS.COORDENADAS] ? d[COLS.COORDENADAS].split(',') : [-35.42, -71.65];
                            return {
                                nombre: d[COLS.NOMBRE] || "S/N",
                                titular: d[COLS.TITULAR] || "S/T",
                                sector: d[COLS.SECTOR] || "Otros",
                                estado: d[COLS.ESTADO] || "N/A",
                                inversion: parseFloat(d[COLS.INVERSION]) || 0,
                                lat: parseFloat(coords[0]),
                                lng: parseFloat(coords[1]),
                                link: d[`link_${COLS.NOMBRE}`] || null
                            };
                        }).filter(d => d.nombre !== "S/N");
                        setData(parsed);
                    } catch (e) { console.error(e); }
                    setLoading(false);
                };
                fetchAPI();
            }, []);

            const filtered = data.filter(d => d.nombre.toLowerCase().includes(searchTerm.toLowerCase()));
            const sectors = [...new Set(data.map(d => d.sector))];
            const kpiTotal = filtered.reduce((acc, curr) => acc + curr.inversion, 0);

            if (loading) return <div className="flex h-screen items-center justify-center font-bold text-slate-400">Consultando base de datos Maule...</div>;

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden">
                    <aside className="w-64 bg-brand text-white p-6 hidden md:flex flex-col">
                        <div className="mb-8 font-bold text-xl">CChC Maule</div>
                        <button onClick={onBack} className="text-indigo-200 hover:text-white mb-8 flex items-center gap-2">← Salir</button>
                        <div className="space-y-4">
                            <div className="text-[10px] uppercase font-black text-slate-500">Estado Conexión</div>
                            <div className="text-xs text-emerald-400 flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> API En Vivo</div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-white border-b p-4 flex justify-between items-center px-8">
                            <h2 className="font-extrabold text-xl text-slate-800 tracking-tight">Monitor Proyectos SEA</h2>
                            <div className="relative w-72">
                                <Search className="absolute left-3 top-2.5 text-slate-400" size={18} />
                                <input type="text" placeholder="Buscar proyecto..." className="pl-10 pr-4 py-2 bg-slate-100 rounded-xl w-full text-sm outline-none" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="bg-white p-6 rounded-2xl shadow-soft border">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Proyectos Activos</p>
                                    <h3 className="text-3xl font-black text-slate-800">{filtered.length}</h3>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-soft border">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Inversión Total</p>
                                    <h3 className="text-3xl font-black text-indigo-600">{formatMoney(kpiTotal)}</h3>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-soft border">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Región</p>
                                    <h3 className="text-3xl font-black text-slate-800">Maule</h3>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 h-[450px] bg-white rounded-2xl p-2 shadow-soft border">
                                    <MapComponent data={filtered} sectors={sectors} onProjectClick={setSearchTerm} />
                                </div>
                                <div className="bg-white rounded-2xl p-6 shadow-soft border flex flex-col overflow-hidden">
                                    <h3 className="font-bold mb-4 text-slate-700">Top 5 Inversiones</h3>
                                    <div className="space-y-3 overflow-y-auto">
                                        {[...filtered].sort((a,b) => b.inversion - a.inversion).slice(0, 5).map((p, i) => (
                                            <div key={i} className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                                                <div className="text-xs font-bold text-slate-800 truncate">{p.nombre}</div>
                                                <div className="text-[10px] font-bold text-indigo-500 uppercase">{formatMoney(p.inversion)}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-soft border overflow-hidden">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-400 font-bold text-[10px] uppercase border-b">
                                        <tr><th className="px-6 py-4">Iniciativa</th><th className="px-6 py-4">Titular</th><th className="px-6 py-4">Sector</th><th className="px-6 py-4 text-right">Monto</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {filtered.slice(0, 10).map((p, i) => (
                                            <tr key={i} className="hover:bg-slate-50">
                                                <td className="px-6 py-4 font-bold text-slate-700">{p.link ? <a href={p.link} target="_blank" className="text-indigo-600 underline">{p.nombre}</a> : p.nombre}</td>
                                                <td className="px-6 py-4 text-slate-500 text-xs">{p.titular}</td>
                                                <td className="px-6 py-4"><span className="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] font-bold">{p.sector}</span></td>
                                                <td className="px-6 py-4 text-right font-mono font-bold">{formatMoney(p.inversion)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('landing');
            const Landing = () => (
                <div className="h-screen bg-brand flex flex-col items-center justify-center text-white p-6">
                    <div className="bg-white p-6 rounded-3xl mb-8 shadow-2xl"><img src="https://cchc.cl/documents/431409/0/logoCChC.png" className="h-16" /></div>
                    <h1 className="text-5xl font-black mb-4 text-center">Monitor SEA Maule</h1>
                    <p className="text-indigo-200 mb-12 text-center text-lg font-light">Conexión en tiempo real con la base de datos de inversión regional</p>
                    <button onClick={() => setView('dashboard')} className="px-12 py-5 bg-white text-brand font-black rounded-2xl hover:scale-105 transition-all shadow-xl flex items-center gap-4">INGRESAR AL PANEL <ArrowRight /></button>
                </div>
            );
            return view === 'landing' ? <Landing /> : <Dashboard onBack={() => setView('landing')} />;
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
