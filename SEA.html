        const SimpleBarChart = ({ data, onBarClick }) => {

            const maxValue = Math.max(...data.map(d => d.value));
            const colors = ['#4f46e5', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#14b8a6'];

            return (
                <div className="space-y-3 py-2">
                    {data.map((item, index) => {
                        const percentage = (item.value / maxValue) * 100;
                        const color = colors[item.colorIndex % colors.length] || colors[index % colors.length];

                        return (
                            <div key={index} className="group">
                                <div className="flex items-center justify-between mb-1">

                                </div>

                                    <div
                                        className="absolute inset-y-0 left-0 rounded-lg transition-all duration-500 group-hover:opacity-90"
                                        style={{
                                            width: `${percentage}%`,
                                            backgroundColor: color,
                                            boxShadow: `0 0 10px ${color}40`
                                        }}

            const [currentPage, setCurrentPage] = useState(1);

            const PROXY_URL_PRIMARY = `https://corsproxy.io/?${encodeURIComponent(SHEET_CSV_URL)}`;
            const PROXY_URL_BACKUP = `https://api.allorigins.win/raw?url=${encodeURIComponent(SHEET_CSV_URL)}`;

            // ===================================================================================
            // INICIO PARSE DATA DEFINITIVO (FECHAS + INVERSIÓN INTELIGENTE)
            // ===================================================================================
            const parseData = (csv) => {
                const lines = csv.split(/\r\n|\n/).map(l => l.trim()).filter(l => l);
                if (lines.length < 2) return [];

                const parseLine = (text) => { const res = []; let cur = '', inQ = false; for (let char of text) { if (char === '"') { inQ = !inQ; } else if (char === ',' && !inQ) { res.push(cur.trim()); cur = ''; } else cur += char; } res.push(cur.trim()); return res; };
                const headers = parseLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());

                // 1. HELPER FECHAS
                const parseDateString = (dateStr) => {
                    if (!dateStr) return null;
                    if (/^\d+$/.test(dateStr)) return new Date((parseInt(dateStr) - 25569) * 86400000);
                    let s = dateStr.trim().replace(/^"|"$/g, '');
                    Object.entries(SHORT_MONTHS).forEach(([k, v]) => { if (s.toLowerCase().includes(k)) s = s.toLowerCase().replace(k, (v + 1).toString()); });
                    const datePartOnly = s.split(/[ T]/)[0];
                    const p = datePartOnly.split(/[\/\-\.]/);
                    if (p.length >= 3) {
                        const v0 = parseInt(p[0]), v1 = parseInt(p[1]), v2 = parseInt(p[2]);
                        if (v0 > 1000) return new Date(v0, v1 - 1, v2);
                        else if (v2 > 1000) return new Date(v2, v1 - 1, v0);
                    }
                    const d = new Date(s);
                    return isNaN(d.getTime()) ? null : d;
                };

                // 2. HELPER NÚMEROS (ROBUSTO)
                // Intenta detectar si es formato CL (1.000,50) o US/Excel RAW (1000.50)
                const parseChileanNumber = (str) => {
                    if (!str) return 0;
                    // Eliminar todo excepto números, puntos, comas y signos
                    let clean = str.toString().replace(/[^0-9,.-]/g, '');

                    // Caso 1: Tiene comas. En CL/EU, coma es decimal.
                    if (clean.includes(',')) {
                        clean = clean.replace(/\./g, '').replace(',', '.');
                    }
                    // Caso 2: No tiene comas, pero tiene MÚLTIPLES puntos. Son miles (1.000.000)
                    else if ((clean.match(/\./g) || []).length > 1) {
                        clean = clean.replace(/\./g, '');
                    }
                    // Caso 3: No tiene comas y tiene UN SOLO punto.
                    // Aquí asumimos formato computacional/US (1000.50) que es común en CSV raw.
                    // NO eliminamos el punto.

                    const num = parseFloat(clean);
                    return isNaN(num) ? 0 : num;
                };

                return lines.slice(1).map(line => {
                    const row = parseLine(line); const obj = {}; headers.forEach((h, i) => obj[h] = row[i]?.replace(/^"|"$/g, '') || '');

                    const find = (keys) => { for (let k of keys) { if (obj[k]) return obj[k]; const fuzzy = Object.keys(obj).find(ok => ok.toLowerCase().includes(k.toLowerCase())); if (fuzzy) return obj[fuzzy]; } return ''; };

                    const nombre = find(['Nombre', 'Proyecto']) || 'Sin Nombre'; if (nombre === 'Sin Nombre') return null;
                    const sector = find(['Sector', 'Productivo']) || 'Otros'; const estado = find(['Estado', 'SEIA']) || 'N/A'; const tipo = find(['Tipo', 'Tipología']) || 'N/A'; const titular = find(['Titular', 'Empresa']);
                    const fechaStr = find(['Fecha', 'Presentación']);
                    const fechaCalStr = find(['Fecha calificación', 'Calificación']);
                    const link = find(['Link', 'Enlace', 'URL']);

                    // LÓGICA DE INVERSIÓN
                    const invStr = find(['Inversión', 'MMU$']) || '0';
                    const inv = parseChileanNumber(invStr);

                    // --- LÓGICA DE FECHAS ---
                    let anio = 'N/A', mes = 'N/A', timestamp = 0; let fechaObj = parseDateString(fechaStr);
                    if (fechaObj && !isNaN(fechaObj.getTime()) && fechaObj.getFullYear() > 1900) {
                        anio = fechaObj.getFullYear().toString(); mes = MONTH_NAMES[fechaObj.getMonth()]; timestamp = fechaObj.getTime();
                    }

                    let anioCal = 'N/A', mesCal = 'N/A'; let fechaCalObj = parseDateString(fechaCalStr);
                    if (fechaCalObj && !isNaN(fechaCalObj.getTime()) && fechaCalObj.getFullYear() > 1900) {
                        anioCal = fechaCalObj.getFullYear().toString(); mesCal = MONTH_NAMES[fechaCalObj.getMonth()];
                    }

                    let latStr = find(['Latitud', 'lat']); let lngStr = find(['Longitud', 'lng']); let lat = parseFloat(latStr ? latStr.replace(',', '.') : '0'); let lng = parseFloat(lngStr ? lngStr.replace(',', '.') : '0');
                    if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) { const loc = find(['Localización', 'Comuna']).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); for (let [k, v] of Object.entries(MAULE_COORDS)) { if (loc.includes(k)) { lat = v.lat + (Math.random() - 0.5) * 0.05; lng = v.lng + (Math.random() - 0.5) * 0.05; break; } } }

                    let approvalMonths = null;
                    if (fechaObj && fechaCalObj) {
                        const totalDays = countDays(fechaObj, fechaCalObj);
                        if (totalDays > 0 && fechaCalObj >= fechaObj) {
                            const adjustedDays = totalDays + 5;
                            approvalMonths = (adjustedDays / 30).toFixed(1);
                        }
                    }

                    return {
                        nombre, sector, estado, tipo, titular, inversion: inv,
                        fecha: fechaStr, anio, mes, fechaCal: fechaCalStr, anioCal, mesCal,
                        fechaObj, fechaCalObj, lat, lng, link, timestamp, approvalMonths
                    };
                }).filter(Boolean);
            };
            // ===================================================================================
            // FIN PARSE DATA DEFINITIVO
            // ===================================================================================

            useEffect(() => {
                const fetchData = async () => {
                    setLoading(true); setError(null);
                    try {
                        let response = await fetch(PROXY_URL_PRIMARY);
                        if (!response.ok) { response = await fetch(PROXY_URL_BACKUP); }
                        if (!response.ok) throw new Error('Error de conexión en ambos proxies');
                        const text = await response.text();
                        if (text.includes('404 Not Found') || text.length < 50) throw new Error('Datos vacíos o inválidos');
                        const parsed = parseData(text);
                        if (parsed.length === 0) throw new Error('No se encontraron filas válidas');
                        setData(parsed); setIsLive(true); setLoading(false);
                    } catch (err) {
                        console.error("Error fatal:", err);
                        const mockCSV = `Nombre,Titular,Sector,Estado,Inversión,Fecha,Latitud,Longitud\n"Error Conexión","Demo","Energía","En Calificación","120","15/03/2023",-35.4264,-71.6554`;
                        setData(parseData(mockCSV)); setIsLive(false); setError(`Error de Conexión: ${err.message}`); setLoading(false);
                    }
                };
                fetchData();
            }, []);

            useEffect(() => { setCurrentPage(1); }, [selectedSectors, selectedEstados, selectedTipos, selectedPeriods, selectedPeriodsCal, searchTerm]);

            const getFilteredData = (ignoreType) => {
                return data.filter(d => {
                    if (ignoreType !== 'sector' && selectedSectors.length > 0 && !selectedSectors.includes(d.sector)) return false;
                    if (ignoreType !== 'estado' && selectedEstados.length > 0 && !selectedEstados.includes(d.estado)) return false;
                    if (ignoreType !== 'tipo' && selectedTipos.length > 0 && !selectedTipos.includes(d.tipo)) return false;
                    if (ignoreType !== 'periodo' && Object.keys(selectedPeriods).length > 0) { const ms = selectedPeriods[d.anio]; if (!ms || !ms.includes(d.mes)) return false; }
                    if (ignoreType !== 'periodoCal' && Object.keys(selectedPeriodsCal).length > 0) { const ms = selectedPeriodsCal[d.anioCal]; if (!ms || !ms.includes(d.mesCal)) return false; }
                    if (searchTerm && !d.nombre.toLowerCase().includes(searchTerm.toLowerCase()) && !d.titular.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    return true;
                });
            };

            const sectors = useMemo(() => { const subset = getFilteredData('sector'); return [...new Set(subset.map(d => d.sector))].sort(); }, [data, selectedEstados, selectedTipos, selectedPeriods, selectedPeriodsCal, searchTerm]);
            const estados = useMemo(() => { const subset = getFilteredData('estado'); return [...new Set(subset.map(d => d.estado))].sort(); }, [data, selectedSectors, selectedTipos, selectedPeriods, selectedPeriodsCal, searchTerm]);
            const tipos = useMemo(() => { const subset = getFilteredData('tipo'); return [...new Set(subset.map(d => d.tipo))].sort(); }, [data, selectedSectors, selectedEstados, selectedPeriods, selectedPeriodsCal, searchTerm]);
            const dataForPeriods = useMemo(() => getFilteredData('periodo'), [data, selectedSectors, selectedEstados, selectedTipos, selectedPeriodsCal, searchTerm]);
            const dataForPeriodsCal = useMemo(() => getFilteredData('periodoCal'), [data, selectedSectors, selectedEstados, selectedTipos, selectedPeriods, searchTerm]);
            const filtered = useMemo(() => getFilteredData('none'), [data, selectedSectors, selectedEstados, selectedTipos, selectedPeriods, selectedPeriodsCal, searchTerm]);

            const sortedData = useMemo(() => [...filtered].sort((a, b) => b.timestamp - a.timestamp), [filtered]);
            const totalPages = Math.ceil(sortedData.length / itemsPerPage);
            const paginatedData = sortedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            const handlePrevPage = () => setCurrentPage(prev => Math.max(prev - 1, 1));
            const handleNextPage = () => setCurrentPage(prev => Math.min(prev + 1, totalPages));
            const handleMapProjectClick = (projectName) => { if (searchTerm === projectName) setSearchTerm(''); else setSearchTerm(projectName); };
            const handleMapSectorClick = (sectorName) => { if (sectorName === 'CLEAR_ALL') { setSelectedSectors([]); return; } setSelectedSectors(prev => prev.includes(sectorName) ? prev.filter(s => s !== sectorName) : [...prev, sectorName]); };

            const kpiTotal = filtered.reduce((a, b) => a + b.inversion, 0);
            const avgApprovalMonths = useMemo(() => {
                const validProjects = filtered.filter(d => d.estado === 'Aprobado' && (d.tipo === 'DIA' || d.tipo === 'Declaración de Impacto Ambiental') && d.fechaObj && d.fechaCalObj);
                if (validProjects.length === 0) return null;
                const totalMonths = validProjects.reduce((acc, curr) => { const totalDays = countDays(curr.fechaObj, curr.fechaCalObj); const adjustedDays = totalDays + 5; return acc + (adjustedDays / 30); }, 0);
                return (totalMonths / validProjects.length).toFixed(1);
            }, [filtered]);
            const chartData = useMemo(() => { const m = {}; filtered.forEach(d => m[d.sector] = (m[d.sector] || 0) + d.inversion); return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 8); }, [filtered]);

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden font-sans">
                    {sidebarOpen && (<div className="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm md:hidden transition-opacity animate-fade-in" onClick={() => setSidebarOpen(false)} />)}
                    <aside className={`fixed md:static inset-y-0 left-0 z-50 w-72 bg-brand text-white flex flex-col shadow-2xl transition-transform duration-300 ease-out ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-6 flex items-center justify-between border-b border-slate-800/50 bg-slate-900/30">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-1.5 rounded-xl shadow-lg shadow-indigo-500/30 ring-1 ring-white/10 h-10 w-10 flex items-center justify-center overflow-hidden"><img src="https://cchc.cl/documents/431409/0/logoCChC.png/002fea99-2039-beec-02a7-a92335532d6f?t=1695346405910" alt="CChC Logo" className="w-full h-full object-contain" /></div>
                                <div><h1 className="font-bold text-lg leading-none tracking-tight">CChC Maule</h1><p className="text-[10px] text-indigo-300 font-medium tracking-widest mt-1 uppercase">Proyectos en SEA</p></div>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-white transition-colors"><X size={24} /></button>
                        </div>
                        <nav className="flex-1 p-5 space-y-6 overflow-y-auto custom-scrollbar">
                            <div className="space-y-2">
                                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-2">Menú Principal</div>
                                <button onClick={onBack} className="w-full flex items-center gap-3 px-4 py-3 text-indigo-200 hover:bg-white/5 rounded-xl transition-all group mb-2">
                                    <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform" /> <span className="font-medium">Volver a Portada</span>
                                </button>
                            </div>
                            <div className="space-y-3">
                                <div className="flex items-center justify-between px-2 mb-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Filtros Activos</span>
                                    {(selectedSectors.length > 0 || selectedEstados.length > 0 || selectedTipos.length > 0 || Object.keys(selectedPeriods).length > 0 || Object.keys(selectedPeriodsCal).length > 0) && (<button onClick={() => { setSelectedSectors([]); setSelectedEstados([]); setSelectedTipos([]); setSelectedPeriods({}); setSelectedPeriodsCal({}); }} className="text-[10px] text-indigo-400 hover:text-indigo-300 hover:underline">Limpiar</button>)}
                                </div>
                                <div className="space-y-4">
                                    <PeriodSelector label="Periodo ingreso" data={dataForPeriods} selectedPeriods={selectedPeriods} onChange={setSelectedPeriods} yearKey="anio" monthKey="mes" />
                                    <PeriodSelector label="Periodo calificación" data={dataForPeriodsCal} selectedPeriods={selectedPeriodsCal} onChange={setSelectedPeriodsCal} yearKey="anioCal" monthKey="mesCal" />
                                    <MultiSelect label="Sector Productivo" options={sectors} selected={selectedSectors} onChange={setSelectedSectors} icon={Building2} />
                                    <MultiSelect label="Estado SEA" options={estados} selected={selectedEstados} onChange={setSelectedEstados} icon={Check} />
                                    <MultiSelect label="Tipología" options={tipos} selected={selectedTipos} onChange={setSelectedTipos} icon={Filter} />
                                </div>
                            </div>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-50/50">
                        <header className="bg-white/80 backdrop-blur-md border-b border-slate-200/80 flex flex-col md:flex-row items-center justify-between px-6 py-4 z-20 sticky top-0">
                            <div className="w-full md:w-auto flex items-center justify-between mb-3 md:mb-0">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setSidebarOpen(true)} className="p-2 -ml-2 rounded-xl hover:bg-slate-100 text-slate-600 md:hidden transition-colors"><Menu size={24} /></button>
                                    <div><h2 className="font-bold text-slate-800 text-xl tracking-tight">Visión Regional</h2><p className="text-xs text-slate-500 hidden sm:block">Región del Maule • Chile</p></div>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="flex-1 md:w-80 flex items-center bg-slate-100/80 rounded-xl px-4 py-2.5 border border-transparent focus-within:border-indigo-300 focus-within:bg-white focus-within:ring-4 focus-within:ring-indigo-100/50 transition-all duration-300 group"><Search size={18} className="text-slate-400 mr-3 group-focus-within:text-indigo-500 transition-colors" /><input type="text" placeholder="Buscar proyecto..." className="bg-transparent border-none outline-none text-sm w-full text-slate-700 placeholder-slate-400" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
                                <div className="hidden md:flex items-center gap-3 pl-4 border-l border-slate-200"><div className={`flex flex-col items-end ${isLive ? 'text-emerald-600' : 'text-red-600'}`}><span className="text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">{isLive ? <Wifi size={10} /> : <WifiOff size={10} />}{isLive ? 'Conectado' : error ? 'Error' : 'Demo'}</span></div></div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 custom-scrollbar scroll-smooth">
                            {error && (<div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-center gap-3 animate-fade-in"><WifiOff size={20} /><div><p className="font-bold text-sm">Error de Conexión</p><p className="text-xs">{error} - Mostrando datos de ejemplo.</p></div></div>)}
                            {loading ? (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6"><SkeletonCard /><SkeletonCard /><SkeletonCard /></div>
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[450px]"><div className="bg-white rounded-2xl shadow-soft border border-slate-100 shimmer"></div><div className="lg:col-span-2 bg-white rounded-2xl shadow-soft border border-slate-100 shimmer"></div></div>
                                    <SkeletonTable />
                                </div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3 md:gap-4">
                                        <KPICard title="Proyectos" value={new Intl.NumberFormat('es-CL').format(filtered.length)} subtext={filtered.length === data.length ? "Total histórico" : "Filtrados"} icon={Database} bgClass="bg-blue-50" colorClass="text-blue-600" delay={0} />
                                        <KPICard title="Inversión Total" value={formatMoney(kpiTotal)} subtext="Millones USD" icon={Wallet} bgClass="bg-emerald-50" colorClass="text-emerald-600" delay={100} />
                                        <KPICard title="Sector Líder" value={chartData[0]?.name || 'N/A'} subtext="Mayor inversión acumulada" icon={TrendingUp} bgClass="bg-purple-50" colorClass="text-purple-600" delay={200} />
                                        <KPICard title="Tiempo Aprobación" value={avgApprovalMonths ? `${avgApprovalMonths} Meses` : "No hay aprobados"} subtext={avgApprovalMonths ? "Promedio DIA filtrados" : "En selección actual"} icon={Calendar} bgClass="bg-orange-50" colorClass="text-orange-600" delay={300} />
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                        <div className="lg:col-span-1 bg-white p-5 rounded-2xl shadow-soft border border-slate-100 flex flex-col h-[500px] lg:h-[500px] animate-fade-in" style={{ animationDelay: '300ms' }}>
                                            <div className="mb-4 flex items-center justify-between"><h3 className="font-bold text-slate-700 flex items-center gap-2"><span className="w-1.5 h-6 bg-indigo-500 rounded-full"></span>Inversión por Sector</h3><button className="text-slate-400 hover:text-indigo-600 transition-colors"><MoreHorizontal size={20} /></button></div>
                                            <div className="flex-1">
                                                <SimpleBarChart data={chartData} onBarClick={handleMapSectorClick} />
                                            </div>
                                        </div>
                                        <div className="lg:col-span-2 bg-white p-4 rounded-2xl shadow-soft border border-slate-100 relative flex flex-col animate-fade-in" style={{ animationDelay: '400ms' }}>
                                            <div className="absolute top-6 left-6 z-10 bg-white/95 backdrop-blur px-4 py-2.5 rounded-xl shadow-lg border border-slate-100 pointer-events-none"><h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm"><MapIcon size={16} className="text-indigo-500" /> Mapa Geoespacial</h3></div>
                                            <MapComponent data={filtered} sectors={sectors} selectedSectors={selectedSectors} currentSearch={searchTerm} onSectorClick={handleMapSectorClick} onProjectClick={handleMapProjectClick} />
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl shadow-soft border border-slate-100 flex flex-col overflow-hidden animate-fade-in" style={{ animationDelay: '500ms' }}>
                                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
                                            <div><h3 className="font-bold text-slate-700 text-lg">Detalle de Proyectos</h3><p className="text-slate-400 text-xs mt-1">Listado completo de iniciativas ingresadas al SEA</p></div>
                                            <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 border border-indigo-100 px-3 py-1.5 rounded-lg shadow-sm">{filtered.length} Resultados</span>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left table-fixed">
                                                <thead className="bg-slate-50/80 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase tracking-wider">
                                                    <tr>
                                                        <th className="px-3 py-3 pl-6 w-[25%]">Proyecto</th><th className="px-3 py-3 w-[20%]">Titular</th><th className="px-3 py-3 w-[12%]">Sector</th><th className="px-3 py-3 w-[13%]">Estado</th><th className="px-3 py-3 w-[15%] text-center">T. Aprobación <span className="block text-[9px] text-slate-400 font-normal normal-case mt-0.5">Meses</span></th><th className="px-3 py-3 text-right pr-6 w-[15%]">Inversión <span className="block text-[9px] text-slate-400 font-normal normal-case mt-0.5">Millones USD</span></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {paginatedData.map((d, idx) => (
                                                        <tr key={idx} className="hover:bg-indigo-50/40 transition-colors group">
                                                            <td className="px-3 py-2.5 font-medium text-slate-700 pl-6 align-middle"><div className="truncate w-full" title={d.nombre}>{d.link ? (<a href={d.link} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 group/link hover:text-indigo-600 transition-colors"><span className="truncate">{d.nombre}</span><ArrowUpRight size={12} className="opacity-0 group-hover/link:opacity-100 text-indigo-500 flex-shrink-0" /></a>) : (<span>{d.nombre}</span>)}</div><span className="text-[10px] text-slate-400 block mt-0.5">{d.fecha}</span></td>
                                                            <td className="px-3 py-2.5 text-slate-500 align-middle"><div className="truncate w-full text-xs font-medium bg-slate-50 px-2 py-1 rounded border border-slate-100" title={d.titular}>{d.titular}</div></td>
                                                            <td className="px-3 py-2.5 align-middle"><div className="flex items-center gap-1.5 text-slate-600 font-medium truncate"><span className={`w-1.5 h-1.5 rounded-full flex-shrink-0`} style={{ backgroundColor: COLORS[sectors.indexOf(d.sector) % COLORS.length] }}></span><span className="text-xs truncate" title={d.sector}>{d.sector}</span></div></td>
                                                            <td className="px-3 py-2.5 align-middle"><span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold border whitespace-nowrap ${d.estado === 'Aprobado' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>{d.estado === 'Aprobado' ? <Check size={10} className="mr-1 stroke-[3]" /> : <div className="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5 animate-pulse"></div>}{d.estado}</span></td>
                                                            <td className="px-3 py-2.5 text-center align-middle">{d.approvalMonths ? (<span className="text-slate-600 font-mono text-xs font-medium bg-slate-50 px-2 py-0.5 rounded border border-slate-100">{d.approvalMonths}</span>) : <span>&nbsp;</span>}</td>
                                                            <td className="px-3 py-2.5 text-right pr-6 align-middle"><span className="font-mono text-slate-700 font-bold bg-slate-50 px-2 py-0.5 rounded border border-slate-100 shadow-sm whitespace-nowrap text-xs">{new Intl.NumberFormat('es-CL', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(d.inversion)}</span></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        {filtered.length > itemsPerPage && (
                                            <div className="p-3 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center">
                                                <button onClick={handlePrevPage} disabled={currentPage === 1} className={`flex items-center gap-2 px-4 py-1.5 rounded-xl text-sm font-medium transition-all border ${currentPage === 1 ? 'text-slate-300 border-transparent cursor-not-allowed' : 'text-slate-600 bg-white border-slate-200 hover:border-indigo-300 hover:text-indigo-600 hover:shadow-md'}`}><ChevronLeft size={16} /> Anterior</button>
                                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Página <span className="text-slate-800 text-sm">{currentPage}</span> de {totalPages}</span>
                                                <button onClick={handleNextPage} disabled={currentPage === totalPages} className={`flex items-center gap-2 px-4 py-1.5 rounded-xl text-sm font-medium transition-all border ${currentPage === totalPages ? 'text-slate-300 border-transparent cursor-not-allowed' : 'text-slate-600 bg-white border-slate-200 hover:border-indigo-300 hover:text-indigo-600 hover:shadow-md'}`}>Siguiente <ChevronRight size={16} /></button>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                            <div className="h-8"></div>
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('landing');
            return (
                <>
                    {view === 'landing' ? (
                        <LandingPage onEnter={() => setView('dashboard')} />
                    ) : (
                        <Dashboard onBack={() => setView('landing')} />
                    )}
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
